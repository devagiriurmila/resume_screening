{% extends "base.html" %}
{% block title %}Candidates{% endblock %}
{% block content %}
<h1 class="page-title h3 mb-3">Candidate Results</h1>
<div class="card p-3 mb-3">
  <div class="row g-2 align-items-end">
    <div class="col-md-3"><label class="form-label small" for="q">Search</label>
      <input id="q" class="form-control" placeholder="Name, email, skill, file"></div>
    <div class="col-md-3"><label class="form-label small" for="session">Screening session</label>
      <select id="session" class="form-select"><option value="">All sessions</option>
        {% for s in sessions %}<option value="{{ s.id }}">#{{ s.id }} - {{ s.job_title }} ({{ s.created_at }})</option>{% endfor %}</select></div>
    <div class="col-md-2"><label class="form-label small" for="min_score">Min score %</label>
      <input id="min_score" type="number" min="0" max="100" class="form-control"></div>
    <div class="col-md-2"><label class="form-label small" for="review">Review status</label>
      <select id="review" class="form-select"><option value="">Any</option><option value="pending">Pending</option>
        <option value="shortlisted">Shortlisted</option><option value="on_hold">On hold</option>
        <option value="not_selected">Not selected</option></select></div>
    <div class="col-md-2"><label class="form-label small" for="flag">Manual review</label>
      <select id="flag" class="form-select"><option value="">Any</option><option value="1">Flagged</option><option value="0">Not flagged</option></select></div>
  </div>
</div>
<div class="card p-3">
  <div class="table-responsive">
    <table class="table table-hover align-middle" id="table">
      <thead><tr>
        <th class="sortable" data-sort="name">Candidate</th><th>Contact</th><th>Skills</th>
        <th class="sortable" data-sort="experience">Experience</th><th>Education</th>
        <th class="sortable" data-sort="score">Match %</th><th>Matched</th><th>Missing / unconfirmed</th>
        <th>Status</th><th class="sortable" data-sort="review_status">Review</th></tr></thead>
      <tbody id="rows"><tr><td colspan="10" class="text-center text-muted">Loading...</td></tr></tbody>
    </table>
  </div>
  <div class="d-flex justify-content-between align-items-center">
    <span class="small text-muted" id="count"></span>
    <nav><ul class="pagination pagination-sm mb-0" id="pager"></ul></nav>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/candidates.js') }}"></script>{% endblock %}
