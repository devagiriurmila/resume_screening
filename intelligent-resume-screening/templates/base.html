<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resume Screening{% endblock %} - Intelligent Resume Screening</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-brand mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('pages.index') }}">&#128196; ResumeScreen</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        {% set ep = request.endpoint or '' %}
        <li class="nav-item"><a class="nav-link {{ 'active' if ep == 'pages.index' }}" href="{{ url_for('pages.index') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if ep.startswith('pages.job') }}" href="{{ url_for('pages.jobs') }}">Jobs</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if ep == 'pages.upload' }}" href="{{ url_for('pages.upload') }}">Upload</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if ep.startswith('pages.candidate') }}" href="{{ url_for('pages.candidates') }}">Candidates</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if ep == 'pages.screenings' }}" href="{{ url_for('pages.screenings') }}">Reports</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container pb-5">
  <div id="alerts"></div>
  {% block content %}{% endblock %}
</main>
<footer class="container text-center pb-4">
  Academic prototype. Scores are skill-keyword matches to support - never replace - human recruiter decisions.
</footer>
<script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
